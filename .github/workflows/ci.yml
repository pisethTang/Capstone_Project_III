name: CI

on:
  push:
  pull_request:

jobs:
  cpp-tests:
    name: C++ Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev libeigen3-dev

      - name: Configure CMake
        run: cmake -S . -B build-tests

      - name: Build C++ tests
        run: cmake --build build-tests -j$(nproc)

      - name: Run C++ tests
        run: ctest --test-dir build-tests --output-on-failure
